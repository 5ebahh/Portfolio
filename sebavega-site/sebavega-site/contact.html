<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — Sebastian Vega</title>
    <meta name="description" content="Sebastian Vega — design and photography portfolio.">
    <!-- Link previews (Open Graph / social cards): what sites like LinkedIn, iMessage,
         Discord and forums show when this page is shared. Image is 1200 x 630 in assets/og/. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Sebastian Vega">
    <meta property="og:title" content="Contact — Sebastian Vega">
    <meta property="og:description" content="Sebastian Vega — design and photography portfolio.">
    <meta property="og:url" content="https://sebavega.com/contact">
    <meta property="og:image" content="https://sebavega.com/assets/og/home.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Mr. Blue, a pixel-art betta fish, beside the hand-lettered name Sebastian Vega in blue on notebook paper">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Favicon (browser tab icon): Mr. Blue the betta, in pixel art. -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600&family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.typekit.net/rzu3vfi.css">
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="assets/contact.css">
    <script src="assets/site.js" defer></script>
    <script src="assets/contact-desk.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header">
      <a href="./" aria-label="Sebastian Vega — home" class="brand">
        <img src="assets/seba-logo.png" width="240" height="120" alt="SEBA">
      </a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Open navigation menu">
        <span class="hamburger" aria-hidden="true">
          <i>
          </i>
          <i>
          </i>
          <i>
          </i>
        </span>
      </button>
      <nav id="main-nav" aria-label="Main navigation">
        <a href="work">work</a>
        <a href="gallery">gallery</a>
        <a href="contact" aria-current="page">contact</a>
      </nav>
    </header>
    <main id="main" class="contact-page">
      <!--
        THE COMPUTER
        On screens 900px and wider: a pixel-art monitor on a desktop case
        (drawn by assets/contact-desk.js) sitting on a pixel desk, with the
        "screen" below laid over it.
        Below 900px: a simpler beige screen and its buttons.
        This page has no footer and never scrolls.
      -->
      <div class="desk">
        <canvas class="desk-scene" width="164" height="150" aria-hidden="true"></canvas>

        <!-- The computer screen: real HTML, so the buttons are proper links. -->
        <div class="desk-screen">
          <div class="os-menubar" aria-hidden="true">
            <span>File</span>
            <span>Edit</span>
            <span>Help</span>
            <span class="os-clock"></span>
          </div>

          <!-- The desktop: one line of text and three app icons, centred on the
               screen's background (no window). -->
          <section class="os-desktop" aria-labelledby="contact-title">
            <h1 class="os-kicker" id="contact-title">Let’s connect</h1>

            <!--
              ICONS: 16 x 16 pixel images in assets/icons/, scaled up with crisp
              pixels by contact.css. To change one, replace its .png (keep it
              16 x 16, or update the width/height below).
            -->
            <nav class="os-buttons" aria-label="Find me online">
              <a class="os-button" href="https://www.linkedin.com/in/5ebah/" target="_blank" rel="noopener noreferrer">
                <img class="os-icon" src="assets/icons/linkedin.png" alt="" width="16" height="16">
                <span class="os-label">LinkedIn</span>
              </a>
              <a class="os-button" href="https://www.instagram.com/se.bas7ian/" target="_blank" rel="noopener noreferrer">
                <img class="os-icon" src="assets/icons/instagram.png" alt="" width="16" height="16">
                <span class="os-label">Instagram</span>
              </a>
              <!-- RESUME: opens the resume PDF on Google Drive. To update it, replace the
                   file in Drive (keeping the same link), or paste a new link here. -->
              <a class="os-button" href="https://drive.google.com/file/d/1t8mQrOinqBeGehFvhAvp8cQb30OGEW70/view?usp=sharing" target="_blank" rel="noopener noreferrer">
                <img class="os-icon" src="assets/icons/resume.png" alt="" width="16" height="16">
                <span class="os-label">Resume</span>
              </a>
            </nav>
          </section>
        </div>

        <!-- Bottom of the computer (only shown below 900px). -->
        <div class="desk-chin" aria-hidden="true"></div>
      </div>

      <!-- The desk under the computer, with a plant on it (only shown 900px and wider). -->
      <div class="desk-table" aria-hidden="true">
        <canvas class="desk-plant" width="40" height="52"></canvas>
        <div class="desk-top"></div>
        <div class="desk-front"></div>
        <div class="desk-legs"></div>
      </div>
    </main>
    <div class="page-loader" hidden role="status" aria-live="polite">
      <canvas width="96" height="96" aria-hidden="true">
      </canvas>
      <p>Drawing things together…</p>
    </div>
  </body>
</html>
